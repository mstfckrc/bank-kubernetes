apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: api-gateway
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: api-gateway
        image: docker.io/mstfckrc/api-gateway:sha-e68b8a70be199967c28b73bb179879e777a2679d
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: EUREKA_URL
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: EUREKA_URL
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: 'true'
        - name: EUREKA_INSTANCE_IP_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SPRING_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: REDIS_HOST
        - name: SPRING_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: REDIS_PORT
        - name: OAUTH_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: OAUTH_ISSUER_URI
        - name: KEYCLOAK_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: KC_INTERNAL_URL
        - name: GATEWAY_CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: GATEWAY_CORS_ALLOWED_ORIGINS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bank-demo
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8081
    targetPort: http

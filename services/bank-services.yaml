apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: backend
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: backend
        image: docker.io/mstfckrc/backend:sha-96d5690fc0a030d59ecff76dff136f759fc0308a
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: EUREKA_URL
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: EUREKA_URL
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: 'true'
        - name: EUREKA_INSTANCE_IP_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: CORE_DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: bank-demo-db-core
              key: POSTGRES_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: bank-demo-db-core
              key: POSTGRES_PASSWORD
        - name: SPRING_RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: RMQ_HOST
        - name: SPRING_RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: RMQ_PORT
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: bank-demo-rabbitmq
              key: username
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bank-demo-rabbitmq
              key: password
        - name: OAUTH_ISSUER_URI
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: OAUTH_ISSUER_URI
        - name: OAUTH_JWK_SET_URI
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: OAUTH_JWK_SET_URI
        - name: BANK_SERVICE_TOKEN_URI
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: BANK_SERVICE_TOKEN_URI
        - name: BANK_SERVICE_CLIENT_ID
          value: bank-core-service
        - name: BANK_SERVICE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: bank-demo-client-credentials
              key: CORE_BANK_SERVICE_CLIENT_SECRET
        - name: ELASTICSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: bank-config
              key: ES_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bank-demo
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 8080
    targetPort: http
---

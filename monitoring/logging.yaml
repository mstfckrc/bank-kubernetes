apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: bank-demo
data:
  logstash.conf: "# 1. DİNLEME NOKTASI (Nereden İstihbarat Gelecek?)\ninput {\n  tcp\
    \ {\n    port => 5000\n    codec => json_lines\n  }\n}\n\n# 2. SÜZGEÇ (Gerekirse\
    \ veriyi burada şekillendiririz - Şimdilik boş bırakıyoruz)\nfilter {\n  # İleride\
    \ \"Sadece ERROR'ları al\" veya \"Tarih formatını düzelt\" gibi komutları buraya\
    \ yazacağız.\n}\n\n# 3. TESLİMAT NOKTASI (İstihbarat Nereye Gidecek?)\noutput\
    \ {\n  elasticsearch {\n    hosts => [\"http://elasticsearch:9200\"]\n    index\
    \ => \"bank-logs-%{+YYYY.MM.dd}\" # Logları gün gün arşiv klasörlerine ayırıyoruz\n\
    \  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: elasticsearch
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: elasticsearch
        image: elasticsearch:8.12.2
        ports:
        - name: http
          containerPort: 9200
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
      volumes:
      - name: data
        emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: bank-demo
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: logstash
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: logstash
        image: logstash:8.12.2
        ports:
        - name: tcp
          containerPort: 5000
        - name: health
          containerPort: 9600
        env:
        - name: LS_JAVA_OPTS
          value: -Xms256m -Xmx256m
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: tcp
          periodSeconds: 10
        volumeMounts:
        - name: pipeline
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
          readOnly: true
      volumes:
      - name: pipeline
        configMap:
          name: logstash-config
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: bank-demo
spec:
  selector:
    app: logstash
  ports:
  - name: tcp
    port: 5000
    targetPort: tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: kibana
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: kibana
        image: kibana:8.12.2
        ports:
        - name: http
          containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: http://elasticsearch:9200
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/status
            port: http
          periodSeconds: 10
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /api/status
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: bank-demo
spec:
  selector:
    app: kibana
  ports:
  - name: http
    port: 5601
    targetPort: http

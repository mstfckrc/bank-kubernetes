apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: discovery-server
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: discovery-server
        image: docker.io/mstfckrc/discovery-server:sha-e68b8a70be199967c28b73bb179879e777a2679d
        ports:
        - name: http
          containerPort: 8761
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: bank-demo
spec:
  selector:
    app: discovery-server
  ports:
  - name: http
    port: 8761
    targetPort: http

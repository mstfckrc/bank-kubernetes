apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: rabbitmq
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management
        ports:
        - name: amqp
          containerPort: 5672
        - name: management
          containerPort: 15672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: bank-demo-rabbitmq
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: bank-demo-rabbitmq
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: amqp
          periodSeconds: 10
          failureThreshold: 18
        readinessProbe:
          tcpSocket:
            port: amqp
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: bank-demo
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
  - name: management
    port: 15672
    targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bank-demo
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: redis
  template:
    metadata:
      labels: *id001
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bank-demo
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
